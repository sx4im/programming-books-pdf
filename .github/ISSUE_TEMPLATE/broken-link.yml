---
name: Broken link
description: Report a broken, redirected, or incorrect link
title: "[Broken link] "
labels: ["bug", "broken-link"]
body:
  - type: markdown
    attributes:
      value: For **malicious or phishing** links, prefer the process in [SECURITY.md](https://github.com/sx4im/programming-books-pdf/blob/main/SECURITY.md).
  - type: input
    id: file
    attributes:
      label: Where did you see it?
      description: Prefer the live library URL or books.json id. Do not paste working Drive links in public issues if avoidable.
      placeholder: https://freecodebooks.vercel.app/library?lang=python  or  python-fluent-python
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Resource title
      placeholder: Fluent Python
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Current URL (optional — leave blank if unknown)
      placeholder: https://
    validations:
      required: false
  - type: dropdown
    id: problem
    attributes:
      label: What is wrong?
      options:
        - 404 / not found
        - Permission denied / private
        - Redirects to unrelated content
        - Wrong book or edition
        - Read book fails on the website
        - Other
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Suggested replacement (maintainers only — optional)
      placeholder: leave blank as a contributor
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
